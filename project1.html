<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            display: grid;
            grid-template-columns: 200px 200px 200px 200px;
            grid-template-rows: 200px 200px 200px ;
            gap: 10px;
            background-color: rgb(199, 199, 199);
            padding: 10px;
            height: 100vh;
            justify-content: center;
        
        }
        .items{
            background-color: rgb(37, 87, 37);
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 2;
            
        }
           .items1{
           background-color: rgb(28, 26, 129);
           grid-row-start: 1;
           grid-row-end: 2;
           grid-column-start: 2;
           grid-column-end: 3;
          
           
           }
           .items2{
           background-color: rgb(129, 26, 26);
           grid-row-start: 1;
           grid-row-end: 2;        
           grid-column-start: 3;
           grid-column-end:4;
           
           
           }
           .items3{
           background-color: rgb(129, 115, 26);
           grid-row-start: 1;
           grid-row-end: 2;        
           grid-column-start: 4;
           grid-column-end:5;
           
           
           }
              .items4{ 
                background-color: rgb(87, 37, 87);
                grid-row-start: 2;
                grid-row-end: 3;    
                grid-column-start: 1;
                grid-column-end:4;
               }
                .items5{ 
                    background-color: rgb(26, 129, 115);
                    grid-row-start: 2;
                    grid-row-end: 3;    
                    grid-column-start: 4;
                    grid-column-end:5;
                 }
        .items6{
            background-color: rgb(115, 87, 26);
            grid-row-start: 3;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 2;
        }
        .items7{
            background-color: rgb(26, 87, 129);
            grid-row-start: 3;
            grid-row-end: 4;
            grid-column-start: 2;
            grid-column-end:4;
        }
        .items8{
            background-color: rgb(129, 26, 87);
            grid-row-start: 3;
            grid-row-end: 4;
            grid-column-start: 4;
            grid-column-end:5;
        }

    </style>
</head>
<body>
    <div class="parent">
        <div class="items"></div>
        <div class="items1"></div>
        <div class="items2"></div>  
        <div class="items3"></div>
        <div class="items4"></div>
        <div class="items5"></div>
        <div class="items6"></div>

        <div class="items7"></div>
        <div class="items8"></div>

    </div>
    
</body>
</html>
