<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .parent {
        display: grid;
        grid-template-columns: 500px 500px;
        grid-template-rows: 200px;
        margin: 100px auto;
        gap: 20px;
        width: 80%;

        
      }
      .items img {
        width: 100%;
        height: 100%;
        border-radius: 10px;
      }
      /* .items{
            background-color: rgb(212, 14, 14);
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            border-radius: 10px;
        } */
      .form {
        background-color: rgb(14, 14, 212);
        grid-column: 2 / 3;
        grid-row: 1 / 2;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
    
      }
        .form input {
            width: 80%;
            padding: 10px;
            margin: 0px 0;
            border-radius: 5px;
            border-color: black;
        }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="items"><img src="image 1.jpg" alt="" /></div>
      <div class="form">
        <form action="">
          <h1>Login Form</h1>
          <input type="text" placeholder="Username" required /><br />
          <input type="password" placeholder="Password" required /><br />
          <button type="submit">Login</button>
        </form>
      </div>
    </div>
  </body>
</html>
