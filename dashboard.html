<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .parent {
        display: grid;
        grid-template-columns: 150px 1fr;
        grid-template-rows: 80px 1fr;
        background-color: rgb(199, 199, 199);
        padding: 10px;
        height: 100vh;
      }
      .items {
        background-color: rgb(37, 87, 37);
        grid-row-start: 1;
        grid-row-end: 3;
        grid-column-start: 1;
        grid-column-end: 2;
        text-align: center;
      }
      .items1 {
        background-color: rgb(28, 26, 129);
        grid-row-start: 1;
        grid-row-end: 2;
        grid-column-start: 2;
        grid-column-end: 3;
      }
      .items2 {
        background-color: #fff;
        grid-row-start: 2;
        grid-row-end: 3;
        grid-column-start: 2;
        grid-column-end: 3;
      }
      /* .items2{
                display: grid;
                grid-template-columns: 280px 280px 280px 280px;
                grid-template-rows: 200px 200px 200px ;
                gap: 10px;
                background-color: rgb(238, 223, 223);       
                padding: 10px;
        

                
                
            } */
      .items2 {
        display: grid;
        grid-template-columns: 24% 24% 24% 24%;
        grid-template-rows: 25% 30% 40%;
        gap: 10px;
        background-color: rgb(238, 223, 223);
        padding: 10px;
      }
      .child1 {
        background-color: rgb(87, 37, 87);
        grid-row-start: 1;
        grid-row-end: 2;
        grid-column-start: 1;
        grid-column-end: 2;
      }
      .child2 {
        background-color: rgb(26, 87, 129);
        grid-row-start: 1;
        grid-row-end: 2;
        grid-column-start: 2;
        grid-column-end: 3;
      }
      .child3 {
        background-color: rgb(129, 87, 26);
        grid-row-start: 1;
        grid-row-end: 2;
        grid-column-start: 3;
        grid-column-end: 4;
      }
      .child4 {
        background-color: rgb(87, 129, 26);
        grid-row-start: 1;
        grid-row-end: 2;
        grid-column-start: 4;
        grid-column-end: 5;
      }
      .child5 {
        background-color: rgb(129, 26, 87);
        grid-row-start: 2;
        grid-row-end: 3;
        grid-column-start: 1;
        grid-column-end: 4;
      }
      .child6 {
        background-color: rgb(26, 129, 87);
        grid-row-start: 2;
        grid-row-end: 3;
        grid-column-start: 4;
        grid-column-end: 5;
      }
      .child7 {
        background-color: rgb(87, 26, 129);
        grid-row-start: 3;
        grid-row-end: 4;
        grid-column-start: 1;
        grid-column-end: 2;
      }
      .child8 {
        background-color: rgb(26, 87, 37);
        grid-row-start: 3;
        grid-row-end: 4;
        grid-column-start: 2;
        grid-column-end: 4;
      }
      .child9 {
        background-color: rgb(115, 87, 26);
        grid-row-start: 3;
        grid-row-end: 4;
        grid-column-start: 4;
        grid-column-end: 5;
      }
      img {
        position: absolute;
        top: -2px;
        right: 10px;
        width: 80px;
        height: 80px;
        border-radius: 50px;
        padding: 20px 20px;
        
      }
    </style>
  </head>

  <body>
    <div class="parent">
      <div class="items">
        <h1>Sidebar</h1>
        <h3>Home Page</h3>
        <h3>Blogs</h3>
        <h3>information</h3>
        <h3>contact us</h3>
      </div>
      <div class="items1">
        <h1>Header</h1>
        <img src="image 1.jpg" alt="" />
      </div>
      <div class="items2">
        <div class="child1"></div>
        <div class="child2"></div>
        <div class="child3"></div>
        <div class="child4"></div>
        <div class="child5"></div>
        <div class="child6"></div>
        <div class="child7"></div>
        <div class="child8"></div>
        <div class="child9"></div>
      </div>
    </div>
  </body>
</html>
