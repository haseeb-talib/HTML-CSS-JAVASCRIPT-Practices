<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            display: grid;
            grid-template-columns: 200px 1fr 150px;
            grid-template-rows: 80px 1fr 80px;
            gap: 10px;
            background-color: rgb(199, 199, 199);
            padding: 10px;
            height: 100vh;
        }
        .header{
            background-color: rgb(26, 115, 129);
            grid-column: 1 / 4;
            grid-row: 1 / 2;
            border-radius: 10px;
        }
        .sidebar{
            background-color: rgb(129, 26, 115);
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            border-radius: 10px;
        }
        .fr{
            background-color: rgb(115, 129, 26);
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            border-radius: 10px;
        }
        .ads{
            background-color: rgb(115, 26, 129);
            grid-column: 3 / 4;
            grid-row: 2 / 3;
            border-radius: 10px;
        }
        .footer{
            background-color: rgb(26, 129, 87);
            grid-column: 1 / 4;
            grid-row: 3 / 4;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="header"></div>
        <div class="sidebar"></div>
        <div class="fr"></div>
        <div class="ads"></div>
        <div class="footer"></div>
        
    </div>
    
</body>
</html>
