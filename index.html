<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .main {
        display: grid;
        grid-template-columns: 200px 200px 200px;
        grid-template-rows: 200px 200px 200px;
      }
      /* task 1 */
      /* .items {
            background-color: rgb(37, 87, 37);
            grid-row-start: 1;
            grid-row-end: 3;
            grid-column-start: 2;
            grid-column-end: 3;
            
        } */
                /* task 2 */
      .items {
        background-color: rgb(37, 87, 37);
        grid-row-start: 1;
        grid-row-end: 2;
        grid-column-start: 2;
        grid-column-end: 3;
        border-radius: 500px;
      }

      .items1 {
        background-color: rgb(28, 26, 129);
        grid-row-start: 2;
        grid-row-end: 3;
        grid-column-start: 1;
        grid-column-end: 2;
        border-radius: 500px;
      }
      .items2 {
        background-color: rgb(129, 26, 26);
        grid-row-start: 2;
        grid-row-end: 3;
        grid-column-start: 3;
        grid-column-end: 4;
        border-radius: 500px;
      }
      .items3 {
        background-color: rgb(129, 115, 26);
        grid-row-start: 3;
        grid-row-end: 4;
        grid-column-start: 2;
        grid-column-end: 3;
        border-radius: 500px;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="items"></div>
      <div class="items1"></div>
      <div class="items2"></div>
      <div class="items3"></div>
    </div>
  </body>
</html>
